name: Apply SULTAN 0.7.1 hardening
on:
  push:
    branches: [hardening/v0.7.1]
    paths:
      - .github/workflows/apply-hardening-v071.yml
      - .github/scripts/harden_v071.py
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hardening transformations
        run: python .github/scripts/harden_v071.py
      - name: Remove one-shot patch machinery
        run: |
          rm .github/scripts/harden_v071.py
          rm .github/workflows/apply-hardening-v071.yml
      - name: Run deterministic tests
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/engine.test.js
          node tests/authority.test.js
          node tests/i18n.test.js
          node tests/hardening071.test.js
          python build.py
      - name: Run browser regression suites
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python tests/beta_browser.py
          python tests/hardening_browser.py
      - name: Commit tested hardening
        run: |
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden SULTAN 0.7 reports, authority UX and test architecture'
          git push origin HEAD:hardening/v0.7.1
