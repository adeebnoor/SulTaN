name: SULTAN RC bootstrap
on:
  push:
    branches: ["rc/0.8.0-rc2"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover payload client routes
        run: |
          set -euxo pipefail
          BASE='https://firestorage.ai'
          URL="$BASE/ja/f/qCVY2e0WkFfC"
          curl -LsS -A 'Mozilla/5.0' "$URL" -o /tmp/page.html
          : > /tmp/all.js
          grep -oE 'src="/[^"]+\.js"' /tmp/page.html | sed 's/^src="//;s/"$//' | sort -u > /tmp/jspaths
          while read -r p; do echo "FETCH $p"; curl -LsS "$BASE$p" >> /tmp/all.js; echo >> /tmp/all.js; done < /tmp/jspaths
          echo '--- API-like paths ---'
          grep -oE '/[A-Za-z0-9_?&=./{}:-]{3,160}' /tmp/all.js | grep -Ei '(api|download|share|file|presign|storage)' | sort -u | head -250 || true
          echo '--- fetch contexts ---'
          grep -oE '.{0,160}(fetch\(|download|presign|shareId|publicId|fileId).{0,360}' /tmp/all.js | head -160 || true
          echo '--- share page RSC markers ---'
          grep -oE '.{0,160}(qCVY2e0WkFfC|2UZPTNJ4sz0YJYVY|sultan_rc_payload).{0,800}' /tmp/page.html | head -60 || true
