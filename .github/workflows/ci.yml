name: Probe SULTAN RC bundle
on:
  push:
    branches: ["rc/0.8.0-bundle3"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe temporary transfer
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --silent --show-error -D /tmp/headers 'https://firestorage.ai/ja/f/8o2AhZRiZNoc' -o /tmp/page
          cat /tmp/headers
          file /tmp/page
          wc -c /tmp/page
          head -c 1200 /tmp/page || true
          echo
          grep -Eo 'https?://[^"<> ]+' /tmp/page | head -40 || true
          grep -Eo 'href="[^"]+"' /tmp/page | head -40 || true
