name: SULTAN RC bootstrap
on:
  push:
    branches: ["rc/0.8.0-rc2"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect payload share page
        run: |
          set -euxo pipefail
          curl -LsS -A 'Mozilla/5.0' 'https://firestorage.ai/ja/f/qCVY2e0WkFfC' -o /tmp/page.html
          wc -c /tmp/page.html
          head -c 1200 /tmp/page.html
          echo
          grep -Eo 'https?://[^"'"'"' <>]+' /tmp/page.html | head -50 || true
          grep -Eo '(href|src)="[^"]+"' /tmp/page.html | head -80 || true
