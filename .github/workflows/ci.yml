name: Probe SULTAN RC bundle
on:
  push:
    branches: ["rc/0.8.0-bundle3"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect firestorage share implementation
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error 'https://firestorage.ai/ja/f/8o2AhZRiZNoc' -o /tmp/page
          curl -L --fail --silent --show-error 'https://firestorage.ai/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js' -o /tmp/app.js
          python - <<'PY'
          from pathlib import Path
          for name in ['page','app.js']:
              s=Path('/tmp/'+name).read_text(errors='replace')
              print('\n###',name,len(s))
              for needle in ['download','api/','public_id','file_id','share','8o2AhZRiZNoc','2BXyPhpR2WaSEmqT','01a0a52ac31b7211b55cbde20d259e62']:
                  print('---',needle)
                  start=0
                  for _ in range(8):
                      i=s.lower().find(needle.lower(),start)
                      if i<0: break
                      print(s[max(0,i-240):i+500].replace('\n',' '))
                      start=i+len(needle)
          PY
