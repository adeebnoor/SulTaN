name: Test and package SULTAN
on:
  push:
    branches: [main, "rc/**", "release/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sultan-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply freeze-gate payload on RC branch
        id: prep
        if: github.ref_name == 'rc/freeze-gate-n1n2n3-v2'
        env:
          SHARE_ID: hWuAyuwpSeIO
        run: |
          set -euxo pipefail
          if grep -q 'freeze gate D1/N1/N2/N3' CHANGELOG.md; then
            echo 'assembled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE='https://api.firestorage.ai/prod/file'
          META=$(curl -fsS "$BASE/shares/$SHARE_ID/files?maxResults=1000")
          FILE_ID=$(echo "$META" | jq -r '.files[] | select((.fileName // .name // "") == "sultan_freeze_gate_payload_v2.zip") | .fileId' | head -1)
          test -n "$FILE_ID" && test "$FILE_ID" != null
          RESP=$(curl -fsS -X POST "$BASE/shares/$SHARE_ID/files/$FILE_ID/download")
          DL=$(echo "$RESP" | jq -r '.downloadUrl')
          test -n "$DL" && test "$DL" != null
          curl -fLsS "$DL" -o /tmp/freeze.zip
          echo 'ea015fd6cda0f34d4dac9ad722f0bc7cb2486dd57cec174c9a65b02b09eac98d  /tmp/freeze.zip' | sha256sum -c -
          unzip -t /tmp/freeze.zip
          unzip -o /tmp/freeze.zip -d .
          echo 'assembled=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all model and locale suites
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          for suite in tests/*.test.js; do echo "== $suite"; node "$suite"; done
      - name: Build standalone application
        run: |
          python build.py
          python - <<'PY'
          import re
          from pathlib import Path
          source=Path('index.html').read_text(encoding='utf-8')
          html=Path('public/index.html').read_text(encoding='utf-8')
          assert not re.findall(r'(?:src|href)="(src/[^"]+)"',html)
          assert len(re.findall(r'<script src=',source)) == 28
          assert "SULTAN_VERSION='0.8.0-rc'" in html
          PY
      - name: Install browser runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test Arabic and English in Chromium
        run: |
          python tests/review_regressions.py
          python tests/beta_browser.py
          python tests/hardening_browser.py
          python tests/surfacing_browser.py
          python tests/rev3_browser.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('qa/review-browser-results.json').read_text(encoding='utf-8'))
          assert data['tests'] >= 369
          assert data['passed'] == data['tests']
          print(f"Review browser regression gate: {data['passed']}/{data['tests']} passed")
          PY
      - name: Commit tested source back to RC branch
        if: steps.prep.outputs.assembled == 'true'
        run: |
          git config user.name 'SULTAN Release Bot'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git add CHANGELOG.md build.py index.html src tests
          git commit -m 'fix: close D1 N1 N2 N3 freeze gate'
          git push origin HEAD:rc/freeze-gate-n1n2n3-v2
      - name: Package verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sultan-product
          path: |
            public/
            release/
            qa/
          retention-days: 14
