name: Test and package SULTAN
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sultan-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surfacing completion payload
        id: prep
        env:
          SHARE_ID: d9ayiENINAyt
        run: |
          set -euxo pipefail
          if grep -q '0.8.0-rc — surfacing completion' CHANGELOG.md; then
            echo 'assembled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE='https://api.firestorage.ai/prod/file'
          META=$(curl -fsS "$BASE/shares/$SHARE_ID/files?maxResults=1000")
          FILE_ID=$(echo "$META" | jq -r '.files[] | select((.fileName // .name // "") == "sultan_surfacing_payload_v3.zip") | .fileId' | head -1)
          test -n "$FILE_ID" && test "$FILE_ID" != null
          RESP=$(curl -fsS -X POST "$BASE/shares/$SHARE_ID/files/$FILE_ID/download")
          DL=$(echo "$RESP" | jq -r '.downloadUrl')
          test -n "$DL" && test "$DL" != null
          curl -fLsS "$DL" -o /tmp/sultan_surfacing_payload.zip
          echo '0120c9ca01ef09168a52bf346e285028a67c43eb7e12822d171c257ea4983993  /tmp/sultan_surfacing_payload.zip' | sha256sum -c -
          unzip -t /tmp/sultan_surfacing_payload.zip
          unzip -o /tmp/sultan_surfacing_payload.zip -d .
          echo 'assembled=true' >> "$GITHUB_OUTPUT"
          git status --short
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify JavaScript, model rules and all locale catalogs
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/engine.test.js
          node tests/hardening.test.js
          node tests/i18n.test.js
          node tests/hardening071.test.js
          node tests/performance.test.js
          node tests/break-even-analytic.test.js
          node tests/final-upgrades.test.js
          node tests/rc080.test.js
      - name: Build the standalone application
        run: |
          python build.py
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('public/index.html').read_text(encoding='utf-8')
          leftover=re.findall(r'(?:src|href)="(src/[^"]+)"',html)
          assert not leftover
          assert "SULTAN_VERSION='0.8.0-rc'" in html
          assert '--brand-logo:url(' in html
          assert '--brand-ivory:#f7f3ea' in html
          PY
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test Arabic and English at a real browser origin
        run: |
          python tests/review_regressions.py
          python tests/beta_browser.py
          python tests/hardening_browser.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('qa/review-browser-results.json').read_text(encoding='utf-8'))
          assert data['tests'] >= 240
          assert data['passed'] == data['tests']
          print(f"Review browser regression gate: {data['passed']}/{data['tests']} passed")
          PY
      - name: Commit verified surfacing source
        if: steps.prep.outputs.assembled == 'true'
        run: |
          git config user.name 'SULTAN Release Bot'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git add src tests CHANGELOG.md
          git commit -m 'feat: complete 0.8.0-rc surfacing spec'
          git push origin HEAD:main
      - name: Seal v0.8.0-rc tag
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v0.8.0-rc >/dev/null 2>&1; then
            echo 'v0.8.0-rc already exists'
          else
            git config user.name 'SULTAN Release Bot'
            git config user.email 'adeebnoor@users.noreply.github.com'
            git tag -a v0.8.0-rc -m 'Seal identity, client exports, execution view'
            git push origin v0.8.0-rc
          fi
      - name: Package application and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sultan-product
          path: |
            public/
            release/
            qa/
          retention-days: 14
      - name: Package the tested website
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sultan-web
          path: public/
          include-hidden-files: true
          retention-days: 14
