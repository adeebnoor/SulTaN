name: Dispatch SULTAN 0.7.1 hardening
on:
  push:
    branches: [main]
    paths: [.github/workflows/dispatch-hardening-v071.yml]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/v0.7.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair one-shot script escaping and regression fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('.github/scripts/harden_v071.py')
          s=p.read_text()
          s=s.replace("out,n=re.subn(pattern,repl,s,count=1,flags=flags)","out,n=re.subn(pattern,lambda _m: repl,s,count=1,flags=flags)")
          s=s.replace("s,n=re.subn(esc_re,esc_new,s,count=1,flags=re.S)","s,n=re.subn(esc_re,lambda _m: esc_new,s,count=1,flags=re.S)")
          s=re.sub(r"s,n=re\.subn\((r\".*?\"),('''.*?'''),s,count=1,flags=re\.S\)",lambda m:f"s,n=re.subn({m.group(1)},lambda _m: {m.group(2)},s,count=1,flags=re.S)",s,flags=re.S)
          old="s=s.replace(f'<h2>{n}.',f'<h2 data-report-section=\"{name}\">{n}.',1)"
          new="s=s.replace(f'<h2>{n}.',f'<h2 data-report-section=\\\\\"{name}\\\\\">{n}.',1)"
          if old not in s:
              raise SystemExit('Semantic report-section patch anchor missing')
          s=s.replace(old,new,1)
          s=s.replace("x.entity==='e2'&&x.code==='authorityIssueUnknownControl'","x.entity==='e2'&&x.code==='authorityIssueUnknownStatus'")
          p.write_text(s)
          PY
      - name: Apply hardening transformations
        run: python .github/scripts/harden_v071.py
      - name: Align browser regression with export menu
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/hardening_browser.py')
          s=p.read_text()
          old='  with page.expect_download() as dl:page.locator(\'[data-exec="leadership-report"]\').click()'
          new='  page.locator(\'.export-menu > summary\').click()\n  with page.expect_download() as dl:page.locator(\'[data-exec="leadership-report"]\').click()'
          if old not in s:
              raise SystemExit('Leadership browser-test anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Remove branch-only patch machinery
        run: |
          rm -f .github/scripts/harden_v071.py
          rm -f .github/workflows/apply-hardening-v071.yml
      - name: Run deterministic tests
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/engine.test.js
          node tests/hardening.test.js
          node tests/i18n.test.js
          node tests/hardening071.test.js
          python build.py
      - name: Run browser regression suites
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python tests/beta_browser.py
          python tests/hardening_browser.py
      - name: Commit tested product changes to feature branch
        run: |
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git restore --source=HEAD -- .github/workflows/ci.yml
          git add -A
          git commit -m 'fix: harden SULTAN 0.7 reports, authority UX and test architecture'
          git push origin HEAD:hardening/v0.7.1
