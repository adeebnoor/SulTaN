name: Apply staged V layer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v-layer.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed V-layer changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              assert old in s, f'missing expected source in {path}: {old[:90]!r}'
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # V6 — every JS suite runs and the measured browser floor is exact.
          replace_once('.github/workflows/ci.yml',
          """          node tests/engine.test.js
          node tests/hardening.test.js
          node tests/i18n.test.js
          node tests/hardening071.test.js
          node tests/performance.test.js
          node tests/break-even-analytic.test.js
          node tests/final-upgrades.test.js
          node tests/rc080.test.js""",
          """          # Every suite under tests/ runs. Do NOT list suites by name: a new
          # test file must never be able to exist without being executed.
          for suite in tests/*.test.js; do echo "== $suite"; node "$suite"; done""")
          replace_once('.github/workflows/ci.yml',
                       "assert data['tests'] >= 240, f\"review browser regression surface dropped to {data['tests']} checks\"",
                       "assert data['tests'] >= 315, f\"review browser regression surface dropped to {data['tests']} checks\"")

          # V5 — bundled, dated reference data; no network call.
          replace_once('index.html',
                       '<script src="src/locales/final.js"></script><script src="src/i18n.js"></script>',
                       '<script src="src/locales/final.js"></script><script src="src/locales/vision.js"></script><script src="src/i18n.js"></script>')

          vision=r'''/* Vision 2030 realization programs — bundled reference list. No network calls.
             Verified 2026-09-15 against vision2030.gov.sa and the official current programme index.
             Program names and the program set change; re-verify before each release and
             update SultanVision.verifiedOn. SULTAN is not affiliated with, and does not
             endorse or represent, any program; the list is offered only so a user can
             name a programme they already contribute to.
             The programs live on SultanVision, NOT on SultanLocales: tests/i18n.test.js
             asserts every SultanLocales value is a string, so an array here would fail it. */
          (function(root){
          'use strict';
          root.SultanVision=root.SultanVision||{};
          root.SultanVision.verifiedOn='2026-09-15';
          root.SultanVision.source='vision2030.gov.sa/ar/explore/programs';
          root.SultanVision.programs=[
            {id:'ntp',   code:'NTP',   ar:'برنامج التحول الوطني',                         en:'National Transformation Program'},
            {id:'hcdp',  code:'HCDP',  ar:'برنامج تنمية القدرات البشرية',                 en:'Human Capability Development Program'},
            {id:'hstp',  code:'HSTP',  ar:'برنامج تحول القطاع الصحي',                     en:'Health Sector Transformation Program'},
            {id:'qol',   code:'QoL',   ar:'برنامج جودة الحياة',                           en:'Quality of Life Program'},
            {id:'nidlp', code:'NIDLP', ar:'برنامج تطوير الصناعة الوطنية والخدمات اللوجستية', en:'National Industrial Development and Logistics Program'},
            {id:'fsdp',  code:'FSDP',  ar:'برنامج تطوير القطاع المالي',                   en:'Financial Sector Development Program'},
            {id:'pif',   code:'PIF',   ar:'برنامج صندوق الاستثمارات العامة',              en:'Public Investment Fund Program'},
            {id:'pep',   code:'PEP',   ar:'برنامج خدمة ضيوف الرحمن',                      en:'Pilgrim Experience Program'},
            {id:'housing',code:'HP',   ar:'برنامج الإسكان',                               en:'Housing Program'},
            {id:'priv',  code:'PP',    ar:'برنامج التخصيص',                               en:'Privatization Program'},
            {id:'fsp',   code:'FSP',   ar:'برنامج الاستدامة المالية',                     en:'Fiscal Sustainability Program'}
          ];
          /* Suggestion list for a datalist — never a closed <select>: a user may be bound
             by a mandate that is not a Vision program at all. */
          root.SultanVision.titles=function(lang){
            return root.SultanVision.programs.map(function(x){return lang==='en'?x.en:x.ar;});
          };
          root.SultanLocales=root.SultanLocales||{};
          Object.assign(root.SultanLocales.en=root.SultanLocales.en||{}, {
            visionListLabel:'Vision 2030 realization programs',
            visionListHint:'Suggestions only. Type any mandate — a programme, a royal decree, a board resolution, a regulator requirement.',
            visionListDisclaimer:'Reference list bundled with SULTAN, verified %{1}. SULTAN is not affiliated with and does not represent any programme. Confirm the current name in the official source before publishing.',
            visionListVerified:'Programme list verified %{1}',
            sectorList:'Government · federal|Government · regional|Healthcare|Higher education|School education|Financial services|Energy & utilities|Industry & logistics|Telecom & digital|Transport|Tourism & culture|Non-profit|Regulator|Research centre',
            unitList:'%|minutes|hours|days|months|count|per 1,000|per 100,000|SAR|SAR million|index point|level (1–5)|percentage point|beneficiary',
            freqList:'Monthly|Quarterly|Semi-annual|Annual|On each release|On each incident'
          });
          Object.assign(root.SultanLocales.ar=root.SultanLocales.ar||{}, {
            visionListLabel:'برامج تحقيق رؤية ٢٠٣٠',
            visionListHint:'اقتراحات فقط. اكتب أي ولاية تلتزم بها — برنامجًا، أو أمرًا ساميًا، أو قرار مجلس، أو مطلبًا تنظيميًا.',
            visionListDisclaimer:'قائمة مرجعية مضمّنة في سلطان، مُتحقَّق منها في %{1}. سلطان غير مرتبط بأي برنامج ولا يمثّله. تأكّد من الاسم الحالي في المصدر الرسمي قبل النشر.',
            visionListVerified:'قائمة البرامج مُتحقَّق منها في %{1}',
            sectorList:'جهة حكومية · مركزية|جهة حكومية · منطقة|الرعاية الصحية|التعليم العالي|التعليم العام|الخدمات المالية|الطاقة والمرافق|الصناعة واللوجستيات|الاتصالات والرقمنة|النقل|السياحة والثقافة|قطاع غير ربحي|جهة تنظيمية|مركز بحثي',
            unitList:'٪|دقيقة|ساعة|يوم|شهر|عدد|لكل ١٠٠٠|لكل ١٠٠٠٠٠|ريال|مليون ريال|نقطة مؤشر|مستوى (١–٥)|نقطة مئوية|مستفيد',
            freqList:'شهري|ربع سنوي|نصف سنوي|سنوي|عند كل إصدار|عند كل حادثة'
          });
          })(globalThis);
          '''
          Path('src/locales/vision.js').write_text(vision,encoding='utf-8')

          # V3 — open suggestion lists preserve free judgement.
          replace_once('src/app.js',
            " if(options)input=`<select ${attrs}>${Object.entries(options).map(([k,t])=>`<option value=\"${esc(k)}\" ${String(v??'')===k?'selected':''}>${esc(t)}</option>`).join('')}</select>`;",
            " if(Array.isArray(options)){const lid=id+'_list';input=`<input ${attrs} type=\"text\" list=\"${esc(lid)}\" value=\"${esc(v)}\" autocomplete=\"off\"><datalist id=\"${esc(lid)}\">${options.map(o=>`<option value=\"${esc(o)}\"></option>`).join('')}</datalist>`;}\n else if(options)input=`<select ${attrs}>${Object.entries(options).map(([k,t])=>`<option value=\"${esc(k)}\" ${String(v??'')===k?'selected':''}>${esc(t)}</option>`).join('')}</select>`;")
          replace_once('src/app.js',
            " return `<label class=\"field\" for=\"${esc(id)}\"><span>${esc(name)}</span>${input}<span class=\"help\" id=\"${esc(id)}_help\">${esc(help)}</span><span class=\"field-error\" hidden></span></label>`;}\nconst fields=",
            " return `<label class=\"field\" for=\"${esc(id)}\"><span>${esc(name)}</span>${input}<span class=\"help\" id=\"${esc(id)}_help\">${esc(help)}</span><span class=\"field-error\" hidden></span></label>`;}\nconst SECTORS=()=>T('sectorList').split('|');\nconst UNITS=()=>T('unitList').split('|');\nconst FREQS=()=>T('freqList').split('|');\nconst fields=")
          replace_once('src/app.js', "['sector',T('s271')]", "['sector',T('s271'),'text','',SECTORS()]")
          replace_once('src/app.js', "['title',T('s288')],['relationship'", "['title',T('s288'),'text','',(globalThis.SultanVision?globalThis.SultanVision.titles(globalThis.SultanI18n.language==='en'?'en':'ar'):[])],['relationship'")
          replace_once('src/app.js', "['unit',T('s336')],['direction'", "['unit',T('s336'),'text','',UNITS()],['direction'")
          replace_once('src/app.js', "['frequency',T('s345')],['dataSource'", "['frequency',T('s345'),'text','',FREQS()],['dataSource'")

          open_lists=r'''/* Open suggestion lists must never become closed selects, and the
             bundled Vision 2030 reference list must stay data — not locale strings. */
          'use strict';
          const assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path'),vm=require('node:vm');
          const root=path.resolve(__dirname,'..');
          const read=f=>fs.readFileSync(path.join(root,f),'utf8');
          const app=read('src/app.js'),index=read('index.html');
          assert.ok(/if\(Array\.isArray\(options\)\)/.test(app),'field() must render an open datalist for array options');
          assert.ok(app.indexOf('Array.isArray(options)')<app.indexOf('else if(options)input=`<select'),'array branch must precede the select branch');
          assert.ok(/<input [^`]*list="\$\{esc\(lid\)\}"/.test(app),'datalist input must carry a list attribute');
          assert.ok(/<datalist id="\$\{esc\(lid\)\}">/.test(app),'a datalist element must be emitted');
          for(const guarded of ['whyUs','tradeoff','decisionReason','outcome','foothold','adaptation','notDoing'])
            assert.ok(!new RegExp("\\['"+guarded+"',T\\('s\\d+'\\),'text','',").test(app),'judgement field must not gain a list: '+guarded);
          for(const wired of [/\['sector',T\('s\d+'\),'text','',SECTORS\(\)\]/,/\['unit',T\('s\d+'\),'text','',UNITS\(\)\]/,/\['frequency',T\('s\d+'\),'text','',FREQS\(\)\]/,/\['title',T\('s\d+'\),'text','',\(globalThis\.SultanVision/])
            assert.ok(wired.test(app),'expected an open list wiring: '+wired);
          assert.ok(index.includes('src/locales/vision.js'),'browser must load the bundled programme list');
          const ctx={globalThis:{SultanLocales:{en:{},ar:{}}}};vm.createContext(ctx);
          vm.runInContext(read('src/locales/vision.js'),ctx,{filename:'vision.js'});
          const V=ctx.globalThis.SultanVision;
          assert.equal(V.programs.length,11,'Vision 2030 has 11 realization programs');
          assert.ok(/^\d{4}-\d{2}-\d{2}$/.test(V.verifiedOn),'the list must carry the date it was verified');
          for(const x of V.programs){for(const k of ['id','code','ar','en'])assert.equal(typeof x[k],'string','programme field '+k);assert.ok(x.ar.trim()&&x.en.trim());}
          assert.equal(new Set(V.programs.map(x=>x.id)).size,11,'programme ids must be unique');
          assert.equal(V.titles('ar').length,11);assert.equal(V.titles('en').length,11);
          assert.notDeepEqual(V.titles('ar'),V.titles('en'),'both locales must be translated');
          for(const [k,v] of Object.entries(ctx.globalThis.SultanLocales.ar))assert.equal(typeof v,'string','locale value must be a string: '+k);
          assert.equal(ctx.globalThis.SultanLocales.ar.programs,undefined,'programme data must live on SultanVision, not SultanLocales');
          assert.ok(/غير مرتبط/.test(ctx.globalThis.SultanLocales.ar.visionListDisclaimer),'Arabic disclaimer must disclaim affiliation');
          assert.ok(/not affiliated/i.test(ctx.globalThis.SultanLocales.en.visionListDisclaimer),'English disclaimer must disclaim affiliation');
          assert.ok(/%\{1\}/.test(ctx.globalThis.SultanLocales.ar.visionListDisclaimer),'the disclaimer must interpolate the verification date');
          console.log(JSON.stringify({suite:'open-lists',passed:true,programs:V.programs.length,verifiedOn:V.verifiedOn}));
          '''
          Path('tests/open-lists.test.js').write_text(open_lists,encoding='utf-8')

          replace_once('tests/rc080.test.js',
            "const scripts=(index.match(/<script src=/g)||[]).length;assert.ok(scripts<=21,'final patch stack should remain consolidated');",
            "/* Cap guards against the patch stack regrowing. Raise deliberately when a legitimate source file is added. */\nconst scripts=(index.match(/<script src=/g)||[]).length;assert.ok(scripts<=22,'final patch stack should remain consolidated');")
          PY
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          for suite in tests/*.test.js; do echo "== $suite"; node "$suite"; done
          python build.py
          git config user.name "SULTAN Release Bot"
          git config user.email "adeebnoor@users.noreply.github.com"
          git add .github/workflows/ci.yml index.html src/app.js src/locales/vision.js tests/open-lists.test.js tests/rc080.test.js
          git commit -m "feat: integrate Vision 2030 V-layer reference data"
          git push origin HEAD:main
