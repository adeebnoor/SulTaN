name: Apply staged V layer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v-layer.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply landing, visual and progressive-disclosure layer
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'missing expected source in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # V1 — four real landing-page anchors; feedback remains an action, not navigation.
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          a=s.index('<header class="public-header">'); b=s.index('</header>',a)+len('</header>')
          header='''<header class="public-header"><div class="public-header-inner"><button id="publicBrand" class="public-brand" data-action="goto" data-section="home" type="button"><span class="brand-glyph" aria-hidden="true">S</span><span><b data-i18n="brand">SULTAN</b><small data-i18n="tagline">Strategy, with a reason.</small></span></button><nav id="publicNav" class="header-links" aria-label="Public navigation"><a href="#methodology" data-home-anchor="methodology">المنهجية</a><a href="#outputs" data-home-anchor="outputs">المخرجات</a><a href="#privacy-limits" data-home-anchor="privacy-limits">الخصوصية والحدود</a><a href="#about-sultan" data-home-anchor="about-sultan">من نحن</a></nav><div class="header-actions"><button class="language-button" type="button" data-beta="language" data-i18n="language" data-i18n-label="languageNote">English</button><button type="button" class="btn small" data-beta="feedback" data-home-feedback>شاركنا ملاحظاتك</button></div></div></header>'''
          p.write_text(s[:a]+header+s[b:],encoding='utf-8')

          # V4 — years are progressively disclosed; one year is open by default.
          old="t.annual.map((a,k)=>`<div class=\"annual\"><div class=\"yearbadge\">${a.year}</div>${fields(`transitions.${i}.annual.${k}`,[['milestone',T('s348'),'textarea'],['evidence',T('s349'),'textarea'],...(t.direction!=='qualitative'?[['target',T('s350'),'number']]:[])])}</div>`).join('')"
          new="t.annual.map((a,k)=>`<details class=\"annual annual-details\" ${k===0?'open':''}><summary><span class=\"yearbadge\">${a.year}</span><span class=\"annual-summary\">${esc(a.milestone||T('s348'))}${a.evidence?'':' · '+esc(T('s349'))}</span></summary>${fields(`transitions.${i}.annual.${k}`,[['milestone',T('s348'),'textarea'],['evidence',T('s349'),'textarea'],...(t.direction!=='qualitative'?[['target',T('s350'),'number']]:[])])}</details>`).join('')"
          replace_once('src/app.js',old,new)

          # V1/V2/V5 presentation layer on the public home page.
          p=Path('src/portal.js'); s=p.read_text(encoding='utf-8')
          marker='function updateChrome(section){'
          i=s.index(marker)
          helpers=r'''const bi=(ar,en)=>I.language==='ar'?ar:en;
function metricPct(n,d){return d?Math.round((n/d)*100):0;}
function strategicVisuals(){
 const E=root.Sultan,p=E.demo(),selected=p.options.find(o=>o.decision==='select')||p.options[0],linked=p.enablers.filter(e=>e.optionId===selected.id),total=linked.length;
 const ownership=metricPct(linked.filter(e=>e.control!=='unknown'&&String(e.owner||'').trim()).length,total),status=metricPct(linked.filter(e=>e.status!=='unknown').length,total),clearance=metricPct(linked.filter(e=>e.status==='ready').length,total),due=linked.map(e=>e.dueYear).filter(Number.isInteger).sort((a,b)=>a-b)[0]||'—';
 const bars=[[bi('وضوح الملكية','Ownership clarity'),ownership],[bi('وضوح الحالة','Status clarity'),status],[bi('خلوص القرار','Decision clearance'),clearance]];
 const authoritySvg=`<svg class="v-svg" viewBox="0 0 720 245" role="img" aria-label="${esc(bi('مساحة الصلاحية','Authority space'))}"><line x1="176" y1="42" x2="676" y2="42" class="v-grid"/><line x1="176" y1="105" x2="676" y2="105" class="v-grid"/><line x1="176" y1="168" x2="676" y2="168" class="v-grid"/>${bars.map((m,k)=>{const y=35+k*63,w=5*m[1];return `<text x="16" y="${y+21}" class="v-label">${esc(m[0])}</text><rect x="176" y="${y}" width="500" height="22" rx="11" class="v-track"/><rect x="176" y="${y}" width="${w}" height="22" rx="11" class="v-fill"/><text x="${Math.min(650,190+w)}" y="${y+17}" class="v-value">${m[1]}%</text>`;}).join('')}<text x="16" y="225" class="v-note">${esc(bi('أقرب موعد قرار','Next decision'))}: ${due}</text></svg>`;
 const be=(E.breakEven(p)||[]).find(x=>x.threshold!==null)||null,ranking=E.ranking(p),cur=be?be.current:0,thr=be?be.threshold:null,cx=92+cur*5.15,tx=thr===null?607:92+thr*5.15;
 const beSvg=`<svg class="v-svg" viewBox="0 0 720 245" role="img" aria-label="${esc(bi('منحنى نقطة التبادل','Break-even curve'))}"><line x1="92" y1="198" x2="648" y2="198" class="v-axis"/><line x1="92" y1="28" x2="92" y2="198" class="v-axis"/><line x1="110" y1="62" x2="622" y2="174" class="v-line-a"/><line x1="110" y1="142" x2="622" y2="82" class="v-line-b"/><line x1="${cx}" y1="35" x2="${cx}" y2="198" class="v-current"/><line x1="${tx}" y1="35" x2="${tx}" y2="198" class="v-threshold"/><circle cx="${tx}" cy="119" r="7" class="v-dot"/><text x="${Math.max(96,cx-22)}" y="222" class="v-note">${cur.toFixed(1)}%</text><text x="${Math.max(96,tx-25)}" y="45" class="v-value">${thr===null?bi('محصّن','No switch'):thr.toFixed(1)+'%'}</text><text x="118" y="55" class="v-label">${esc(ranking[0]?.title||'')}</text><text x="390" y="176" class="v-label">${esc(ranking[1]?.title||'')}</text></svg>`;
 return `<section class="landing-wrap product-section v-visuals" id="decision-visuals"><div class="section-intro"><span class="eyebrow">SULTAN / DECISION EVIDENCE</span><h2>${esc(bi('لا تعرض استراتيجية فقط — اعرض أين يمكن تنفيذها وأين تنقلب المفاضلة','Do not just show a strategy — show where it can execute and where the choice flips'))}</h2><p>${esc(bi('الرسمان أدناه محسوبان من المثال المضمّن نفسه، بلا مكتبة رسوم وبلا اتصال شبكي.','Both views are computed from the bundled example itself, with no chart library and no network call.'))}</p></div><div class="v-chart-grid"><article class="v-chart-card"><div><span class="feature-index">01</span><h3>${esc(bi('مساحة الصلاحية','Authority space'))}</h3><p>${esc(selected.title)} · ${total} ${esc(bi('ممكّنات','enablers'))}</p></div>${authoritySvg}</article><article class="v-chart-card"><div><span class="feature-index">02</span><h3>${esc(bi('نقطة التبادل','Break-even point'))}</h3><p>${be?esc(be.criterion)+' · '+cur.toFixed(1)+'% → '+(thr===null?esc(bi('لا نقطة تبادل','no switch')):thr.toFixed(1)+'%'):esc(bi('لا توجد مفاضلة صالحة','No valid trade-off'))}</p></div>${beSvg}</article></div></section>`;
}
function outputsSection(){const items=I.language==='ar'?[['وثيقة عميل','قرار وخيارات ومفاضلات ومسارات قابلة للتسليم.'],['تقرير داخلي','تفاصيل العمل والملاحظات والحواجز قبل الاعتماد.'],['حزمة تصعيد','ما يحتاج قرارًا خارجيًا، ومن يملكه، ومتى يلزم.'],['ملف JSON','نسخة قابلة للاستيراد والمراجعة دون حبس البيانات.']]:[['Client document','Decision, choices, trade-offs and executable paths.'],['Internal report','Working detail, issues and blockers before approval.'],['Escalation pack','What needs an external decision, who owns it and by when.'],['JSON file','A portable, reviewable project without data lock-in.']];return `<section class="landing-wrap product-section" id="outputs"><div class="section-intro"><span class="eyebrow">SULTAN / OUTPUTS</span><h2>${esc(bi('مخرجات يقرأها صانع القرار — لا لوحة جميلة فقط','Decision-ready outputs — not just a polished dashboard'))}</h2></div><div class="v-output-grid">${items.map((x,i)=>`<article><span class="feature-index">0${i+1}</span><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></article>`).join('')}</div></section>`;}
function visionSection(){const V=root.SultanVision;if(!V)return '';return `<section class="vision-reference"><div class="landing-wrap"><div class="vision-head"><div><span class="eyebrow">VISION 2030 / REFERENCE</span><h2>${esc(bi('سمِّ مساهمتك في برامج تحقيق رؤية ٢٠٣٠ — من دون إجبارك على قائمة مغلقة','Name your contribution to Vision 2030 programs — without forcing a closed list'))}</h2><p>${esc(bi('القائمة مرجع اقتراحات داخل سلطان. تستطيع كتابة برنامج، أو أمر سامٍ، أو قرار مجلس، أو مطلب تنظيمي آخر.','The list is a suggestion reference inside SULTAN. You can still enter a programme, royal decree, board resolution or other regulatory mandate.'))}</p></div><a class="vision-source" href="${esc(V.source)}" target="_blank" rel="noopener noreferrer">${esc(bi('المصدر الرسمي لرؤية ٢٠٣٠ ↗','Official Vision 2030 source ↗'))}</a></div><div class="vision-programs">${V.programs.map(x=>`<span>${esc(I.language==='ar'?x.ar:x.en)}</span>`).join('')}</div><p class="vision-disclaimer">${esc((I.language==='ar'?'قائمة مضمّنة، متحقق منها في ':'Bundled reference, verified ')+V.verifiedOn+(I.language==='ar'?'. سلطان غير مرتبط بأي برنامج ولا يمثله.':'. SULTAN is not affiliated with and does not represent any programme.'))}</p></div></section>`;}
function aboutSection(){return `<section class="landing-wrap product-section about-sultan" id="about-sultan"><div class="about-grid"><div><span class="eyebrow">SULTAN / ORIGIN</span><h2>${esc(bi('منهج استراتيجي له صاحب — لا صندوق أسود','A strategy method with accountable authorship — not a black box'))}</h2></div><div><h3>${esc(T('creator'))}</h3><p>${esc(bi('سلطان يحوّل منهجًا استشاريًا وأكاديميًا منشورًا إلى مساحة عمل عملية: يفرض المفاضلة، يوضح الصلاحية، ويُبقي المجهول ظاهرًا بدل إخفائه في درجة جاهزية واحدة.','SULTAN turns a published academic and advisory method into a working tool: it forces trade-offs, makes authority explicit, and keeps unknowns visible instead of hiding them inside one readiness score.'))}</p><p class="muted">${esc(bi('النسخة العامة المجانية للتجربة وجمع الملاحظات.','Free public beta for use and feedback.'))}</p></div></div></section>`;}
function enhancedHome(args){let html=home(args);html=html.replace('id="features"','id="methodology"');html=html.replace('<section class="quick-section">',strategicVisuals()+outputsSection()+visionSection()+'<section class="quick-section">');html=html.replace('<section class="landing-wrap product-section faq-grid">','<section class="landing-wrap product-section faq-grid" id="privacy-limits">');html=html.replace('<section class="landing-wrap bottom-cta">',aboutSection()+'<section class="landing-wrap bottom-cta">');return html;}
function updateHomeNavLabels(){const labels=I.language==='ar'?{methodology:'المنهجية',outputs:'المخرجات','privacy-limits':'الخصوصية والحدود','about-sultan':'من نحن'}:{methodology:'Method',outputs:'Outputs','privacy-limits':'Privacy & limits','about-sultan':'About'};document.querySelectorAll('[data-home-anchor]').forEach(a=>a.textContent=labels[a.dataset.homeAnchor]||a.textContent);const f=document.querySelector('[data-home-feedback]');if(f)f.textContent=I.language==='ar'?'شاركنا ملاحظاتك':'Share feedback';}
function enhanceWorkspace(section){const p=root.SultanApp?.getProject?.();document.body.classList.toggle('is-pristine',Boolean(p&&!p.isDemo&&(p.revision||0)===0));if(section==='identity'&&root.SultanVision){const content=document.getElementById('content');if(content&&!content.querySelector('.vision-workspace-note')){const note=document.createElement('div');note.className='vision-workspace-note';note.innerHTML=`<b>${esc(T('visionListLabel'))}</b><span>${esc(T('visionListHint'))}</span><small>${esc(T('visionListDisclaimer').replace('%{1}',root.SultanVision.verifiedOn))}</small>`;const first=content.querySelector('.card');if(first)first.insertAdjacentElement('beforebegin',note);}}}
'''
          s=s[:i]+helpers+s[i:]
          start=s.index('function updateChrome(section){'); end=s.index('function dialog(){',start)
          updated=r'''function updateChrome(section){document.body.classList.toggle('is-home',section==='home');const nav=document.querySelector('#publicNav');if(nav)nav.hidden=section!=='home';const feedback=document.querySelector('[data-home-feedback]');if(feedback)feedback.hidden=section!=='home';const brand=document.querySelector('#publicBrand');if(brand)brand.setAttribute('aria-label',T('brand')+' — '+T('s207'));const note=document.querySelector('#localWarning');if(note)note.hidden=section==='home';if(section==='home')updateHomeNavLabels();if(section==='about'){const card=document.querySelector('#content .card:nth-of-type(2)');if(card&&!card.querySelector('.privacy-extra')){const para=document.createElement('p');para.className='privacy-extra';para.textContent=T('privacyExtra');card.append(para);const clear=document.createElement('button');clear.type='button';clear.className='btn small danger';clear.dataset.beta='clear';clear.textContent=T('clearLocal');card.append(clear);}}}
'''
          s=s[:start]+updated+s[end:]
          s=s.replace('SULTAN · BETA 0.6','SULTAN · ${esc(root.SULTAN_VERSION||\'0.8.0-rc\')}',1)
          s=s.replace('SULTAN public beta 0.6\\nType:','SULTAN public beta ${root.SULTAN_VERSION||\'0.8.0-rc\'}\\nType:',1)
          s=s.replace("document.addEventListener('sultan:render',e=>updateChrome(e.detail.section));","document.addEventListener('sultan:render',e=>{updateChrome(e.detail.section);enhanceWorkspace(e.detail.section);});",1)
          s=s.replace("document.addEventListener('click',async e=>{const tab=e.target.closest('[data-preview]');", "document.addEventListener('click',async e=>{const homeLink=e.target.closest('[data-home-anchor]');if(homeLink){e.preventDefault();document.getElementById(homeLink.dataset.homeAnchor)?.scrollIntoView({behavior:'smooth',block:'start'});return;}const tab=e.target.closest('[data-preview]');",1)
          s=s.replace('root.SultanPortal={home,updateChrome};','root.SultanPortal={home:enhancedHome,updateChrome};',1)
          p.write_text(s,encoding='utf-8')

          # Styles: institutional landing navigation, evidence visuals, Vision reference,
          # progressive disclosure, and a softer pristine-project onboarding state.
          p=Path('src/portal.css'); css=p.read_text(encoding='utf-8')
          css+='''\n/* SULTAN V-layer: surfacing methodology, outputs, authority and Vision 2030 reference. */\n.header-links a{color:#315c59;text-decoration:none;font-size:13px;min-height:44px;display:inline-flex;align-items:center;padding:8px 0;border-bottom:2px solid transparent}.header-links a:hover,.header-links a:focus-visible{color:var(--teal);border-color:#b79d59}.v-chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.v-chart-card,.v-output-grid article{border:1px solid #dce7df;border-radius:13px;padding:24px;background:#fff;position:relative}.v-chart-card>div:first-child p{color:#60786d;font-size:12px}.v-svg{width:100%;height:auto;display:block;margin-top:16px;background:#f8faf6;border-radius:10px}.v-grid{stroke:#dce6df;stroke-width:1}.v-track{fill:#e5ece6}.v-fill{fill:#2d7867}.v-axis{stroke:#9fb3a9;stroke-width:1.2}.v-line-a{stroke:#264d72;stroke-width:3;fill:none}.v-line-b{stroke:#b28f39;stroke-width:3;fill:none}.v-current{stroke:#c4a95a;stroke-width:1.5;stroke-dasharray:5 5}.v-threshold{stroke:#9d4c48;stroke-width:1.7;stroke-dasharray:5 4}.v-dot{fill:#9d4c48}.v-label,.v-note,.v-value{font-family:Tahoma,Arial,sans-serif;fill:#315b54;font-size:13px}.v-note{font-size:11px;fill:#63796d}.v-value{font-weight:700}.v-output-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.v-output-grid h3{font-size:17px;margin-top:14px}.v-output-grid p{font-size:13px;color:#597166;margin:0}.vision-reference{background:#12363b;color:#fff;padding-block:58px}.vision-head{display:grid;grid-template-columns:1fr auto;gap:36px;align-items:end}.vision-head h2{font-size:31px;line-height:1.6;margin:8px 0}.vision-head p{color:#c8d8d2;max-width:760px}.vision-source{color:#163d36!important;background:#e8d28d;border-radius:8px;padding:11px 15px;text-decoration:none;font-weight:700}.vision-programs{display:flex;flex-wrap:wrap;gap:9px;margin-top:28px}.vision-programs span{border:1px solid #56776f;background:#ffffff0d;border-radius:999px;padding:7px 11px;font-size:11px}.vision-disclaimer{font-size:10px;color:#b9cec6;margin:20px 0 0}.about-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:70px;border-top:1px solid #dce7df;padding-top:34px}.about-grid h2{font-size:30px;line-height:1.6}.about-grid h3{font-size:20px}.about-grid p{color:#587167}.vision-workspace-note{border:1px solid #d5e2d8;background:#f7faf4;border-radius:10px;padding:14px 16px;margin:0 0 18px;display:grid;gap:5px}.vision-workspace-note b{color:#1d5c4d}.vision-workspace-note span,.vision-workspace-note small{color:#60756c}.annual-details{border:1px solid #dce5df;border-radius:9px;padding:0!important;margin:10px 0;background:#fbfcf9}.annual-details>summary{display:flex;align-items:center;gap:12px;cursor:pointer;padding:11px 13px;min-height:44px}.annual-details[open]>summary{border-bottom:1px solid #e2e9e3}.annual-details>.grid2{padding:14px}.annual-summary{font-size:12px;color:#63786d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.is-pristine .issue.missing,.is-pristine .issue.blocking{border-color:#e5d5a2;background:#fffbef;color:#6d5a28}.is-pristine .issue.missing .dot,.is-pristine .issue.blocking .dot{background:#c7a64b}.is-pristine .issue.missing:before,.is-pristine .issue.blocking:before{content:''}@media(max-width:980px){.v-chart-grid,.about-grid{grid-template-columns:1fr}.v-output-grid{grid-template-columns:1fr 1fr}.vision-head{grid-template-columns:1fr}.header-links{gap:12px}.header-links a{font-size:11px}}@media(max-width:760px){.header-links{order:3;width:100%;overflow:auto;justify-content:flex-start}.header-links a{white-space:nowrap}.v-output-grid{grid-template-columns:1fr}.v-chart-card{padding:15px}.vision-reference{padding-block:40px}.vision-head h2{font-size:25px}}\n'''
          p.write_text(css,encoding='utf-8')

          Path('tests/portal-v-layer.test.js').write_text(r'''/* Public V-layer regression guards. */
'use strict';
const assert=require('node:assert/strict'),fs=require('node:fs');
const index=fs.readFileSync('index.html','utf8'),portal=fs.readFileSync('src/portal.js','utf8'),app=fs.readFileSync('src/app.js','utf8'),css=fs.readFileSync('src/portal.css','utf8'),vision=fs.readFileSync('src/locales/vision.js','utf8');
for(const id of ['methodology','outputs','privacy-limits','about-sultan']) assert.ok(index.includes(`data-home-anchor="${id}"`),'missing public navigation '+id);
assert.equal((index.match(/data-home-anchor=/g)||[]).length,4,'public navigation must have four anchors');assert.ok(!index.includes('id="publicStart"'),'duplicate start-free header CTA must be removed');
assert.ok(portal.includes('strategicVisuals()'));assert.ok(portal.includes('<svg class="v-svg"'));assert.ok(!portal.includes('<canvas'));assert.ok(!portal.includes('<foreignObject'));
assert.ok(app.includes('annual-details'));assert.ok(app.includes("k===0?'open':''"),'one annual row must open by default');assert.ok(css.includes('.is-pristine .issue.missing'));
assert.ok(vision.includes('vision2030.gov.sa/ar/explore/programs'));assert.ok(portal.includes('vision-programs'));assert.ok(!portal.includes('BETA 0.6'));assert.ok(!portal.includes('public beta 0.6'));
console.log(JSON.stringify({suite:'portal-v-layer',passed:true,nav:4,svg:true,vision:true,progressiveDisclosure:true}));
''',encoding='utf-8')
          PY

          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          for suite in tests/*.test.js; do echo "== $suite"; node "$suite"; done
          python build.py
          git config user.name "SULTAN Release Bot"
          git config user.email "adeebnoor@users.noreply.github.com"
          git add index.html src/app.js src/portal.js src/portal.css tests/portal-v-layer.test.js
          git commit -m "feat: surface SULTAN method, evidence and Vision 2030 context"
          git push origin HEAD:main
