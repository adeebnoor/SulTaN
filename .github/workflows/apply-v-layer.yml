name: Apply staged V layer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v-layer.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply, verify and commit reviewed V layer
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'missing expected source in {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # V6 — all JavaScript suites are discovered automatically, and the measured
          # browser regression surface may not drop below the current 315 checks.
          p=Path('.github/workflows/ci.yml'); s=p.read_text(encoding='utf-8')
          start=s.index('          node tests/engine.test.js')
          end=s.index('      - name: Build the standalone application', start)
          suites='''          # Every suite under tests/ runs. Do NOT list suites by name: a new\n          # test file must never be able to exist without being executed.\n          for suite in tests/*.test.js; do echo "== $suite"; node "$suite"; done\n'''
          s=s[:start]+suites+s[end:]
          s=s.replace("assert data['tests'] >= 240, f\"review browser regression surface dropped to {data['tests']} checks\"",
                      "assert data['tests'] >= 315, f\"review browser regression surface dropped to {data['tests']} checks\"",1)
          p.write_text(s,encoding='utf-8')

          # V5 — load a bundled, dated Vision 2030 programme reference. No network call.
          replace_once('index.html',
              '<script src="src/locales/final.js"></script><script src="src/i18n.js"></script>',
              '<script src="src/locales/final.js"></script><script src="src/locales/vision.js"></script><script src="src/i18n.js"></script>')

          vision='''/* Vision 2030 realization programs — bundled reference list. No network calls.\n   Verified 2026-09-15 against the official Vision 2030 programme index.\n   Program names and the program set change; re-verify before each release and\n   update SultanVision.verifiedOn. SULTAN is not affiliated with, and does not\n   endorse or represent, any program; the list is offered only so a user can\n   name a programme they already contribute to. */\n(function(root){\n'use strict';\nroot.SultanVision=root.SultanVision||{};\nroot.SultanVision.verifiedOn='2026-09-15';\nroot.SultanVision.source='https://www.vision2030.gov.sa/ar/explore/programs';\nroot.SultanVision.programs=[\n  {id:'ntp',code:'NTP',ar:'برنامج التحول الوطني',en:'National Transformation Program'},\n  {id:'hcdp',code:'HCDP',ar:'برنامج تنمية القدرات البشرية',en:'Human Capability Development Program'},\n  {id:'hstp',code:'HSTP',ar:'برنامج تحول القطاع الصحي',en:'Health Sector Transformation Program'},\n  {id:'qol',code:'QoL',ar:'برنامج جودة الحياة',en:'Quality of Life Program'},\n  {id:'nidlp',code:'NIDLP',ar:'برنامج تطوير الصناعة الوطنية والخدمات اللوجستية',en:'National Industrial Development and Logistics Program'},\n  {id:'fsdp',code:'FSDP',ar:'برنامج تطوير القطاع المالي',en:'Financial Sector Development Program'},\n  {id:'pif',code:'PIF',ar:'برنامج صندوق الاستثمارات العامة',en:'Public Investment Fund Program'},\n  {id:'pep',code:'PEP',ar:'برنامج خدمة ضيوف الرحمن',en:'Pilgrim Experience Program'},\n  {id:'housing',code:'HP',ar:'برنامج الإسكان',en:'Housing Program'},\n  {id:'priv',code:'PP',ar:'برنامج التخصيص',en:'Privatization Program'},\n  {id:'fsp',code:'FSP',ar:'برنامج الاستدامة المالية',en:'Fiscal Sustainability Program'}\n];\nroot.SultanVision.titles=function(lang){return root.SultanVision.programs.map(function(x){return lang==='en'?x.en:x.ar;});};\nroot.SultanLocales=root.SultanLocales||{};\nObject.assign(root.SultanLocales.en=root.SultanLocales.en||{}, {\n  visionListLabel:'Vision 2030 realization programs',\n  visionListHint:'Suggestions only. Type any mandate — a programme, a royal decree, a board resolution, a regulator requirement.',\n  visionListDisclaimer:'Reference list bundled with SULTAN, verified %{1}. SULTAN is not affiliated with and does not represent any programme. Confirm the current name in the official source before publishing.',\n  visionListVerified:'Programme list verified %{1}',\n  sectorList:'Government · central|Government · regional|Healthcare|Higher education|School education|Financial services|Energy & utilities|Industry & logistics|Telecom & digital|Transport|Tourism & culture|Non-profit|Regulator|Research centre',\n  unitList:'%|minutes|hours|days|months|count|per 1,000|per 100,000|SAR|SAR million|index point|level (1–5)|percentage point|beneficiary',\n  freqList:'Monthly|Quarterly|Semi-annual|Annual|On each release|On each incident'\n});\nObject.assign(root.SultanLocales.ar=root.SultanLocales.ar||{}, {\n  visionListLabel:'برامج تحقيق رؤية ٢٠٣٠',\n  visionListHint:'اقتراحات فقط. اكتب أي ولاية تلتزم بها — برنامجًا، أو أمرًا ساميًا، أو قرار مجلس، أو مطلبًا تنظيميًا.',\n  visionListDisclaimer:'قائمة مرجعية مضمّنة في سلطان، مُتحقَّق منها في %{1}. سلطان غير مرتبط بأي برنامج ولا يمثّله. تأكّد من الاسم الحالي في المصدر الرسمي قبل النشر.',\n  visionListVerified:'قائمة البرامج مُتحقَّق منها في %{1}',\n  sectorList:'جهة حكومية · مركزية|جهة حكومية · منطقة|الرعاية الصحية|التعليم العالي|التعليم العام|الخدمات المالية|الطاقة والمرافق|الصناعة واللوجستيات|الاتصالات والرقمنة|النقل|السياحة والثقافة|قطاع غير ربحي|جهة تنظيمية|مركز بحثي',\n  unitList:'٪|دقيقة|ساعة|يوم|شهر|عدد|لكل ١٠٠٠|لكل ١٠٠٠٠٠|ريال|مليون ريال|نقطة مؤشر|مستوى (١–٥)|نقطة مئوية|مستفيد',\n  freqList:'شهري|ربع سنوي|نصف سنوي|سنوي|عند كل إصدار|عند كل حادثة'\n});\n})(globalThis);\n'''
          Path('src/locales/vision.js').write_text(vision,encoding='utf-8')

          # V3 — open suggestion lists. Arrays become datalists; existing object maps
          # remain closed selects, so judgement fields are still free text.
          replace_once('src/app.js',
              " if(options)input=`<select ${attrs}>${Object.entries(options).map(([k,t])=>`<option value=\"${esc(k)}\" ${String(v??'')===k?'selected':''}>${esc(t)}</option>`).join('')}</select>`;",
              " if(Array.isArray(options)){const lid=id+'_list';input=`<input ${attrs} type=\"text\" list=\"${esc(lid)}\" value=\"${esc(v)}\" autocomplete=\"off\"><datalist id=\"${esc(lid)}\">${options.map(o=>`<option value=\"${esc(o)}\"></option>`).join('')}</datalist>`;}\n else if(options)input=`<select ${attrs}>${Object.entries(options).map(([k,t])=>`<option value=\"${esc(k)}\" ${String(v??'')===k?'selected':''}>${esc(t)}</option>`).join('')}</select>`;")
          replace_once('src/app.js',
              " return `<label class=\"field\" for=\"${esc(id)}\"><span>${esc(name)}</span>${input}<span class=\"help\" id=\"${esc(id)}_help\">${esc(help)}</span><span class=\"field-error\" hidden></span></label>`;}\nconst fields=",
              " return `<label class=\"field\" for=\"${esc(id)}\"><span>${esc(name)}</span>${input}<span class=\"help\" id=\"${esc(id)}_help\">${esc(help)}</span><span class=\"field-error\" hidden></span></label>`;}\nconst SECTORS=()=>T('sectorList').split('|');\nconst UNITS=()=>T('unitList').split('|');\nconst FREQS=()=>T('freqList').split('|');\nconst fields=")
          replace_once('src/app.js', "['sector',T('s271')]", "['sector',T('s271'),'text','',SECTORS()]")
          replace_once('src/app.js', "['title',T('s288')],['relationship'", "['title',T('s288'),'text','',(globalThis.SultanVision?globalThis.SultanVision.titles(globalThis.SultanI18n.language==='en'?'en':'ar'):[])],['relationship'")
          replace_once('src/app.js', "['unit',T('s336')],['direction'", "['unit',T('s336'),'text','',UNITS()],['direction'")
          replace_once('src/app.js', "['frequency',T('s345')],['dataSource'", "['frequency',T('s345'),'text','',FREQS()],['dataSource'")

          tests='''/* Open suggestion lists and bundled Vision 2030 reference data. */\n'use strict';\nconst assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path'),vm=require('node:vm');\nconst root=path.resolve(__dirname,'..');\nconst read=f=>fs.readFileSync(path.join(root,f),'utf8');\nconst app=read('src/app.js'),index=read('index.html');\nassert.ok(/if\\(Array\\.isArray\\(options\\)\\)/.test(app),'field() must render an open datalist for array options');\nassert.ok(app.indexOf('Array.isArray(options)')<app.indexOf('else if(options)input=`<select'),'array branch must precede select branch');\nassert.ok(/<datalist id=/.test(app),'a datalist element must be emitted');\nfor(const guarded of ['whyUs','tradeoff','decisionReason','outcome','foothold','adaptation','notDoing']) assert.ok(!new RegExp("\\\\['"+guarded+"',T\\\\('s\\\\d+'\\\\),'text','',").test(app),'judgement field must stay free: '+guarded);\nfor(const wired of [/\\['sector',T\\('s\\d+'\\),'text','',SECTORS\\(\\)\\]/,/\\['unit',T\\('s\\d+'\\),'text','',UNITS\\(\\)\\]/,/\\['frequency',T\\('s\\d+'\\),'text','',FREQS\\(\\)\\]/,/\\['title',T\\('s\\d+'\\),'text','',\\(globalThis\\.SultanVision/]) assert.ok(wired.test(app),'expected open list wiring: '+wired);\nassert.ok(index.includes('src/locales/vision.js'),'browser must load programme list');\nconst ctx={globalThis:{SultanLocales:{en:{},ar:{}}}};vm.createContext(ctx);vm.runInContext(read('src/locales/vision.js'),ctx,{filename:'vision.js'});\nconst V=ctx.globalThis.SultanVision;assert.equal(V.programs.length,11);assert.ok(/^\\d{4}-\\d{2}-\\d{2}$/.test(V.verifiedOn));\nassert.equal(new Set(V.programs.map(x=>x.id)).size,11);assert.equal(V.titles('ar').length,11);assert.equal(V.titles('en').length,11);\nfor(const [k,v] of Object.entries(ctx.globalThis.SultanLocales.ar)) assert.equal(typeof v,'string','locale value must be string: '+k);\nassert.ok(/غير مرتبط/.test(ctx.globalThis.SultanLocales.ar.visionListDisclaimer));assert.ok(/not affiliated/i.test(ctx.globalThis.SultanLocales.en.visionListDisclaimer));\nconsole.log(JSON.stringify({suite:'open-lists',passed:true,programs:V.programs.length,verifiedOn:V.verifiedOn}));\n'''
          Path('tests/open-lists.test.js').write_text(tests,encoding='utf-8')

          replace_once('tests/rc080.test.js',
              "const scripts=(index.match(/<script src=/g)||[]).length;assert.ok(scripts<=21,'final patch stack should remain consolidated');",
              "/* Cap guards against the patch stack regrowing; 22 includes the bundled Vision 2030 list. */\nconst scripts=(index.match(/<script src=/g)||[]).length;assert.ok(scripts<=22,'final patch stack should remain consolidated');")
          PY

          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          for suite in tests/*.test.js; do echo "== $suite"; node "$suite"; done
          python build.py
          git config user.name "SULTAN Release Bot"
          git config user.email "adeebnoor@users.noreply.github.com"
          git add .github/workflows/ci.yml index.html src/app.js src/locales/vision.js tests/open-lists.test.js tests/rc080.test.js
          git commit -m "feat: integrate Vision 2030 reference layer"
          git push origin HEAD:main
