name: Apply staged V layer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v-layer.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed V-layer patch
        run: |
          git config user.name "SULTAN Release Bot"
          git config user.email "adeebnoor@users.noreply.github.com"
          git apply --check patches/sultan-v-layer-f78140e.patch
          git apply --index patches/sultan-v-layer-f78140e.patch
          git commit -m "feat: integrate Vision 2030 V-layer reference data"
          git push origin HEAD:main
