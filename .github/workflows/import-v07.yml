name: Import SULTAN 0.7 candidate
on:
  push:
    branches: [feature/authorization-space-v0-7]
    paths:
      - .github/workflows/import-v07.yml
      - .release/v07.patch00
      - .release/v07.patch01a
      - .release/v07.patch01b
      - .release/v07.patch02
      - .release/v07.patch03
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and verify reviewed patch
        run: |
          cat .release/v07.patch00 .release/v07.patch01a .release/v07.patch01b .release/v07.patch02 .release/v07.patch03 > /tmp/changes.diff.gz.b64
          base64 -d /tmp/changes.diff.gz.b64 | gzip -d > /tmp/changes.diff
          echo 'dae043bf6bee9f7ad83d971b32dffdd6340839a8e6798019654c340353d624d0  /tmp/changes.diff' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/changes.diff').read_text()
          src=src.replace('--- baseline/source/','--- a/').replace('+++ srcpkg/','+++ b/')
          Path('/tmp/git.diff').write_text(src)
          PY
          git apply --check /tmp/git.diff
          git apply /tmp/git.diff
      - name: Remove transfer scaffolding
        run: |
          rm -rf .release
          rm -f .github/workflows/import-v07.yml
      - name: Run model, authority and language tests
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/engine.test.js
          node tests/authority.test.js
          node tests/i18n.test.js
          python build.py
      - name: Commit tested candidate source to feature branch
        run: |
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Authorization Space and decision-right diagnostics'
          git push origin HEAD:feature/authorization-space-v0-7
