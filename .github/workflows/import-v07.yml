name: Import SULTAN 0.7 candidate
on:
  push:
    branches: [feature/authorization-space-v0-7]
    paths: [.github/workflows/import-v07.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve integrity-pinned reviewed candidate
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, re, html, hashlib, io, zipfile, json
          from pathlib import Path, PurePosixPath
          from html.parser import HTMLParser
          share='https://firestorage.ai/ja/f/SMVH7qCtSyQI'
          expected='31f4dfcde46d84cbb2bfd0f06f4b680f19890da34d9896f3b99b8d6bda08cf8c'
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  for k,v in attrs:
                      if k in ('href','src') and v:self.links.append(v)
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'SULTAN-v0.7-import'})
              with urllib.request.urlopen(req,timeout=45) as r:return r.read(4000000)
          page=fetch(share).decode('utf-8'); parser=Links();parser.feed(page)
          decoded=html.unescape(page).replace('\\"','"').replace('\\/','/')
          candidates=parser.links+re.findall(r'https://[^\s<>"\\]+',decoded)+re.findall(r'"([^"\n]*download[^"\n]*)"',decoded)
          urls=[]
          for raw in candidates:
              target=urllib.parse.urljoin(share,html.unescape(raw))
              if target not in urls and urllib.parse.urlparse(target).scheme=='https' and ('download' in target or '.zip' in target):urls.append(target)
          blob=None
          for target in urls[:30]:
              try:
                  data=fetch(target)
                  if hashlib.sha256(data).hexdigest()==expected:blob=data;break
              except Exception:pass
          if blob is None:raise SystemExit('Pinned candidate ZIP not found; repository unchanged.')
          archive=zipfile.ZipFile(io.BytesIO(blob));manifest=json.loads(archive.read('SOURCE_MANIFEST.json'))
          roots={'index.html','.nojekyll','.gitignore','README.md','CONTRIBUTING.md','CHANGELOG.md','build.py'}
          allowed=('src/','tests/','docs/','.github/ISSUE_TEMPLATE/','.github/workflows/')
          for name,digest in manifest.items():
              path=PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts:raise ValueError('Unsafe path')
              if not(name in roots or name.startswith(allowed)):raise ValueError('Unexpected path '+name)
              data=archive.read(name)
              if hashlib.sha256(data).hexdigest()!=digest:raise ValueError('Checksum mismatch '+name)
              data.decode('utf-8')
          for name in manifest:
              path=Path(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(archive.read(name))
          print('Installed',len(manifest),'reviewed files.')
          PY
      - name: Run model, authority and language tests
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/engine.test.js
          node tests/authority.test.js
          node tests/i18n.test.js
          python build.py
      - name: Commit candidate source to feature branch
        run: |
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Authorization Space and decision-right diagnostics'
          git push origin HEAD:feature/authorization-space-v0-7
