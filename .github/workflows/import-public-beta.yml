name: Import reviewed public beta source
on:
  push:
    branches: [release/public-beta-v0-6]
    paths: [.github/workflows/import-public-beta.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Retrieve integrity-pinned public release
        run: |
          python - <<'PY'
          import re, hashlib, io, zipfile, json
          from pathlib import Path, PurePosixPath
          from playwright.sync_api import sync_playwright
          share='https://firestorage.ai/ja/f/ZVrQHP18Q7bv'
          expected='0552ae4f4d532cbe9232028ae1e64b8efc8068257d6d4bd22382191ca8798bf7'
          blob=None
          with sync_playwright() as pw:
              browser=pw.chromium.launch()
              page=browser.new_page(accept_downloads=True)
              page.goto(share,wait_until='networkidle',timeout=60000)
              page.wait_for_timeout(4000)
              print('Public source-download page:',page.locator('body').inner_text()[:6000])
              print('Download controls:',page.locator('a,button').evaluate_all('(els)=>els.map(e=>({text:e.innerText,label:e.getAttribute("aria-label"),href:e.getAttribute("href")}))'))
              controls=page.locator('a,button').filter(has_text=re.compile('ダウンロード|Download',re.I))
              for i in range(min(controls.count(),8)):
                  try:
                      with page.expect_download(timeout=20000) as result: controls.nth(i).click()
                      data=Path(result.value.path()).read_bytes()
                      if hashlib.sha256(data).hexdigest()==expected: blob=data;break
                      if zipfile.is_zipfile(io.BytesIO(data)):
                          nested=zipfile.ZipFile(io.BytesIO(data))
                          for name in nested.namelist():
                              if name.endswith('SULTAN_Public_Beta_Source_v0_6.zip'):
                                  part=nested.read(name)
                                  if hashlib.sha256(part).hexdigest()==expected: blob=part;break
                      if blob:break
                  except Exception as e: print('Download control:',type(e).__name__)
              Path('release-share-page.html').write_text(page.content())
              browser.close()
          if blob is None: raise SystemExit('No source matching the pinned SHA-256 was found; repository source remains unchanged.')
          archive=zipfile.ZipFile(io.BytesIO(blob));manifest=json.loads(archive.read('SOURCE_MANIFEST.json'))
          roots={'index.html','.nojekyll','.gitignore','README.md','CONTRIBUTING.md','CHANGELOG.md','build.py'}
          for name,digest in manifest.items():
              path=PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts:raise ValueError('Unsafe archive path')
              if not(name in roots or name.startswith(('src/','tests/','docs/','.github/ISSUE_TEMPLATE/'))):raise ValueError('Unexpected release path: '+name)
              data=archive.read(name)
              if hashlib.sha256(data).hexdigest()!=digest:raise ValueError('File checksum mismatch: '+name)
              data.decode('utf-8')
          for name in manifest:
              path=Path(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(archive.read(name))
          print('Installed',len(manifest),'reviewed source files. No client records or credentials are included.')
          PY
      - name: Test arithmetic, localization and build
        run: |
          node tests/engine.test.js
          node tests/i18n.test.js
          python build.py
      - name: Test both languages in a real browser origin
        run: python tests/beta_browser.py
      - name: Commit reviewed source files
        run: |
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git add index.html .nojekyll .gitignore README.md CONTRIBUTING.md CHANGELOG.md build.py src tests docs .github/ISSUE_TEMPLATE
          git commit -m 'feat: launch bilingual free beta with guided workspace and opt-in feedback'
          git push origin HEAD:release/public-beta-v0-6
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sultan-beta-import-evidence
          path: |
            qa/
            public/
            release/
            release-share-page.html
          retention-days: 14
