name: Import reviewed public beta source
on:
  push:
    branches: [release/public-beta-v0-6]
    paths: [.github/workflows/import-public-beta.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve integrity-pinned public release
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, re, html, hashlib, io, zipfile, json
          from pathlib import Path, PurePosixPath
          from html.parser import HTMLParser
          share = 'https://firestorage.ai/ja/f/ZVrQHP18Q7bv'
          expected = '0552ae4f4d532cbe9232028ae1e64b8efc8068257d6d4bd22382191ca8798bf7'
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  for k,v in attrs:
                      if k in ('href','src') and v: self.links.append(v)
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'SULTAN-public-release-import/0.6'})
              with urllib.request.urlopen(req,timeout=45) as response: return response.read(3000000)
          page=fetch(share).decode('utf-8'); parser=Links();parser.feed(page)
          decoded=html.unescape(page).replace('\\"','"').replace('\\/','/')
          candidates=parser.links+re.findall(r'https://[^\s<>"\\]+',decoded)
          candidates += re.findall(r'"([^"\n]*download[^"\n]*)"',decoded)
          urls=[]
          for raw in candidates:
              target=urllib.parse.urljoin(share,html.unescape(raw))
              if target not in urls and urllib.parse.urlparse(target).scheme=='https' and ('download' in target or '.zip' in target): urls.append(target)
          print('Download links found:',urls[:20])
          blob=None
          for target in urls[:20]:
              try:
                  data=fetch(target)
                  if hashlib.sha256(data).hexdigest()==expected: blob=data; break
              except Exception as e: print('Candidate unavailable:',type(e).__name__)
          if blob is None:
              Path('release-share-page.html').write_text(page)
              print('Visible links:',parser.links[:80])
              raise SystemExit('No release matching the pinned SHA-256 was found; no repository files were changed.')
          archive=zipfile.ZipFile(io.BytesIO(blob));manifest=json.loads(archive.read('SOURCE_MANIFEST.json'))
          roots={'index.html','.nojekyll','.gitignore','README.md','CONTRIBUTING.md','CHANGELOG.md','build.py'}
          for name,digest in manifest.items():
              path=PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts: raise ValueError('Unsafe archive path')
              if not(name in roots or name.startswith(('src/','tests/','docs/','.github/ISSUE_TEMPLATE/'))): raise ValueError('Unexpected release path: '+name)
              data=archive.read(name)
              if hashlib.sha256(data).hexdigest()!=digest: raise ValueError('File checksum mismatch: '+name)
              data.decode('utf-8')
          for name in manifest:
              path=Path(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(archive.read(name))
          print('Installed',len(manifest),'reviewed source files. No client records or credentials are included.')
          PY
      - name: Test arithmetic, localization and build
        run: |
          node tests/engine.test.js
          node tests/i18n.test.js
          python build.py
      - name: Test both languages in a real browser origin
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python tests/beta_browser.py
      - name: Commit reviewed source files
        run: |
          git config user.name 'Prof. Adeeb Noor'
          git config user.email 'adeebnoor@users.noreply.github.com'
          git add index.html .nojekyll .gitignore README.md CONTRIBUTING.md CHANGELOG.md build.py src tests docs .github/ISSUE_TEMPLATE
          git commit -m 'feat: launch bilingual free beta with guided workspace and opt-in feedback'
          git push origin HEAD:release/public-beta-v0-6
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sultan-beta-import-evidence
          path: |
            qa/
            public/
            release/
            release-share-page.html
          retention-days: 14
