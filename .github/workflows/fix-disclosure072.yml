name: Apply disclosure correction
on:
  push:
    branches: [fix/review-0.7.2]
    paths: [.github/workflows/fix-disclosure072.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-0.7.2
      - name: Apply reviewed correction with before and after guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          digest=lambda s:hashlib.sha256(s.encode()).hexdigest()
          p=Path('src/execution-upgrades.js');s=p.read_text()
          assert digest(s)=='126d46cf857441486ca63721080c88b6e7f7fd2cb2f2a4da3827119d1735f8e1'
          insert="""// Dismiss the disclosure after selection so it cannot cover the next workspace action.
          document.addEventListener('click',e=>{
           const menu=document.querySelector('.export-menu');if(!menu)return;
           const item=e.target.closest('.export-menu-panel button');
           if(item&&!item.disabled)setTimeout(()=>menu.open=false,0);
           else if(!menu.contains(e.target))menu.open=false;
          },true);
          document.addEventListener('keydown',e=>{
           const menu=document.querySelector('.export-menu');
           if(e.key==='Escape'&&menu?.open){menu.open=false;menu.querySelector('summary').focus();e.preventDefault();}
          });
          """
          s=s.replace('function printInternal(){',insert+'function printInternal(){')
          assert digest(s)=='38d126a4b19117ebf70af995661fb2153c7866e72c0b00e3e9d03660ea4e3908'
          p.write_text(s)
          p=Path('tests/review_regressions.py');s=p.read_text()
          assert digest(s)=='08d0b2ebcffce013ed703d5c9cf7ce1fb39c12602e0f4e1a4c2a37a0940e22e0'
          s=s.replace("                page.locator('.export-menu > summary').click()\n                page.locator('.portfolio-review').screenshot", "                expect(page.locator('.export-menu')).not_to_have_attribute('open', '')\n                page.locator('.portfolio-review').screenshot")
          s=s.replace("        event.value.save_as(str(destination))\n", "        event.value.save_as(str(destination))\n        expect(page.locator('.export-menu')).not_to_have_attribute('open', '')\n")
          assert digest(s)=='19f2c18e1f42a14b0f8ba74b720a79c4932de964fd2ba9c4170244fdcf3f51ce'
          p.write_text(s)
          PY
          node --check src/execution-upgrades.js
          python3 -m py_compile tests/review_regressions.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/execution-upgrades.js tests/review_regressions.py
          git commit -m 'fix: dismiss export disclosure after selection and with Escape'
          git push origin HEAD:fix/review-0.7.2
