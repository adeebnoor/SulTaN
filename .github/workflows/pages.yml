name: Publish tested SULTAN beta
on:
  workflow_run:
    workflows: [Test and package SULTAN]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: sultan-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Retrieve the tested release, not an untested rebuild
        uses: actions/download-artifact@v4
        with:
          name: sultan-product
          path: tested
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Check the artifact and expose a downloadable beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('tested')
          for name in ['beta-browser-results.json','review-browser-results.json']:
              report=json.loads((root/'qa'/name).read_text())
              assert report['mode']=='full-browser' and report['tests']>0 and report['passed']==report['tests'], name
          model=json.loads((root/'qa/model-hardening-results.json').read_text())
          assert model['tests']>0 and model['passed']==model['tests']
          exact=json.loads((root/'qa/break-even-analytic-results.json').read_text())
          assert exact['tests']>0 and exact['passed']==exact['tests'] and exact.get('failed',0)==0
          manifest=json.loads((root/'release/manifest.json').read_text())
          assert manifest['version']=='0.7.4'
          assert hashlib.sha256((root/'public/index.html').read_bytes()).hexdigest()==manifest['sha256']
          (root/'release/SULTAN_Beta_AR_EN.html').write_bytes((root/'public/index.html').read_bytes())
          print('Verified browser behavior, model evidence, exact sensitivity evidence and application SHA-256.')
          PY
          if ! gh release view v0.7.4 >/dev/null 2>&1; then
            gh release create v0.7.4 --target "$TESTED_SHA" --prerelease --title 'SULTAN 0.7.4 — Exact Decision Sensitivity' --notes 'SULTAN now computes exact decision switch-points for strategic criteria instead of relying on a 0.5%-step scan in the normal case. The analytical solver preserves the same proportional redistribution model, supports benefit and cost criteria, retains the prior scan as a safe fallback for degenerate boundary weights or tied leaders, and is verified against representative, randomized, incomplete-data, upper-envelope, and dense numerical-search cases. SULTAN 0.7.4 retains the 0.7.3 performance cache and standalone-build guard, plus all Arabic/English, authority, report, mobile and review-regression gates. Strategic value remains separate from capability/readiness and authorization.' tested/release/SULTAN_Beta_AR_EN.html tested/release/SULTAN_Strategy_Builder_Source.zip tested/release/manifest.json tested/qa/review-browser-results.json tested/qa/model-hardening-results.json tested/qa/break-even-analytic-results.json
          fi
      - name: Check first-time hosting setup
        id: hosting
        uses: actions/github-script@v7
        with:
          script: |
            const {data:repo}=await github.rest.repos.get(context.repo);
            core.setOutput('enabled',String(repo.has_pages));
            if(!repo.has_pages){
              core.notice('The beta is downloadable, but repository Pages is not enabled. Publish the tested artifact through the existing personal-site mirror.');
            }
      - uses: actions/configure-pages@v5
        if: steps.hosting.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.hosting.outputs.enabled == 'true'
        with:
          path: tested/public
      - name: Deploy the tested website
        id: deployment
        if: steps.hosting.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
      - name: Verify public HTTP response
        if: steps.hosting.outputs.enabled == 'true'
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os,time,urllib.request,hashlib,json
          expected=json.load(open('tested/release/manifest.json'))['sha256']
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(os.environ['SITE_URL'],timeout=30) as response:
                      assert response.status==200
                      assert hashlib.sha256(response.read()).hexdigest()==expected
                      print('Verified exact tested public application:',os.environ['SITE_URL'])
                      break
              except Exception:
                  if attempt==11:raise
                  time.sleep(10)
          PY
