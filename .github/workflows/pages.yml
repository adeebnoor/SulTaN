name: Publish tested SULTAN beta
on:
  workflow_run:
    workflows: [Test and package SULTAN]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: sultan-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Retrieve the tested release, not an untested rebuild
        uses: actions/download-artifact@v4
        with:
          name: sultan-product
          path: tested
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Check the artifact and expose a downloadable beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('tested')
          report=json.loads((root/'qa/beta-browser-results.json').read_text())
          assert report['mode']=='full-browser' and report['passed']==report['tests']
          manifest=json.loads((root/'release/manifest.json').read_text())
          assert manifest['version']=='0.7.0'
          assert hashlib.sha256((root/'public/index.html').read_bytes()).hexdigest()==manifest['sha256']
          (root/'release/SULTAN_Beta_AR_EN.html').write_bytes((root/'public/index.html').read_bytes())
          print('Verified full browser evidence and application SHA-256.')
          PY
          if ! gh release view v0.7.0 >/dev/null 2>&1; then
            gh release create v0.7.0 --target "$TESTED_SHA" --prerelease --title 'SULTAN 0.7 — Execution beta' --notes 'Execution-focused SULTAN beta. Authority Space now separates ownership clarity, status clarity, and decision clearance; unknown/pending/blocked authority states enter the consistency system; the release adds an escalation pack, internal and leadership reports, section-level collaboration files, break-even and live sensitivity analysis, benefit/cost criteria, assumptions and risks, execution timeline, value-authority review, and funding context. Strategic value remains separate from readiness and authority. Use non-sensitive data only.' tested/release/SULTAN_Beta_AR_EN.html tested/release/SULTAN_Strategy_Builder_Source.zip tested/release/manifest.json
          fi
      - name: Check first-time hosting setup
        id: hosting
        uses: actions/github-script@v7
        with:
          script: |
            const {data:repo}=await github.rest.repos.get(context.repo);
            core.setOutput('enabled',String(repo.has_pages));
            if(!repo.has_pages){
              core.notice('The beta is downloadable, but GitHub Pages is not enabled. The Render public beta remains available; an administrator can enable Settings > Pages > GitHub Actions later.');
            }
      - uses: actions/configure-pages@v5
        if: steps.hosting.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.hosting.outputs.enabled == 'true'
        with:
          path: tested/public
      - name: Deploy the tested website
        id: deployment
        if: steps.hosting.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
      - name: Verify public HTTP response
        if: steps.hosting.outputs.enabled == 'true'
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os,time,urllib.request
          url=os.environ['SITE_URL']
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url,timeout=30) as response:
                      text=response.read().decode('utf-8')
                      assert response.status==200 and 'SultanPortal' in text and 'SultanLocales' in text
                      print('Verified live bilingual application:',url)
                      break
              except Exception:
                  if attempt==11:raise
                  time.sleep(10)
          PY
