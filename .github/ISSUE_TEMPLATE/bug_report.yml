name: Bug report
description: Report a problem using fictional or non-sensitive information.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "This issue is public. Never attach a real strategy, personal records, credentials, or confidential information."
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options: [Arabic, English]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use the fictional example where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device (optional)
  - type: checkboxes
    id: privacy
    attributes:
      label: Public disclosure
      options:
        - label: I removed all confidential and personal information.
          required: true
